# ── pyproject.toml — Project Configuration ─────────────────
# Static analysis, linting, testing, and build settings

[project]
name = "5simTelegramBot"
version = "2.0.0"
description = "Enterprise SaaS Platform — Telegram Virtual Number Automation"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

# ── Ruff (Linter) ──────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "*.egg-info",
    "data/backups",
    "logs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["bot", "services", "db", "data", "web", "admin", "config"]

# ── MyPy (Type Checker) ────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/"]

# ── Pytest ─────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

# ── Coverage ───────────────────────────────────────────────
[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# ── Bandit (Security) ──────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", ".git"]
skips = ["B101", "B104"]  # assert, bind_all_interfaces