<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NumGenius — Admin Panel</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6;
    --green: #22c55e; --red: #ef4444; --yellow: #eab308;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .sidebar { position: fixed; left:0; top:0; bottom:0; width: 220px; background: var(--card); border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; }
  .sidebar h1 { font-size: 18px; margin-bottom: 30px; color: var(--accent); }
  .sidebar a { display: block; padding: 10px 12px; color: var(--muted); text-decoration: none; border-radius: 6px; margin-bottom: 4px; font-size: 14px; transition: .2s; }
  .sidebar a:hover, .sidebar a.active { background: rgba(59,130,246,.15); color: var(--text); }
  .main { margin-left: 220px; padding: 30px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .card .value { font-size: 28px; font-weight: 700; }
  .card .green { color: var(--green); } .card .red { color: var(--red); } .card .yellow { color: var(--yellow); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  th, td { padding: 12px 16px; text-align: left; font-size: 13px; }
  th { background: rgba(59,130,246,.1); color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
  td { border-top: 1px solid var(--border); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .badge-success { background: rgba(34,197,94,.2); color: var(--green); }
  .badge-warning { background: rgba(234,179,8,.2); color: var(--yellow); }
  .badge-danger { background: rgba(239,68,68,.2); color: var(--red); }
  .loading { color: var(--muted); padding: 40px; text-align: center; }
  h2 { margin-bottom: 16px; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .refresh { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; float: right; margin-bottom: 16px; }
  .refresh:hover { opacity: .9; }
</style>
</head>
<body>

<nav class="sidebar">
  <h1>🛡️ NumGenius</h1>
  <a href="#" onclick="showTab('dashboard')" class="active" data-tab="dashboard">📊 Dashboard</a>
  <a href="#" onclick="showTab('users')" data-tab="users">👥 Users</a>
  <a href="#" onclick="showTab('orders')" data-tab="orders">📦 Orders</a>
  <a href="#" onclick="showTab('payments')" data-tab="payments">💳 Payments</a>
  <a href="#" onclick="showTab('providers')" data-tab="providers">🔌 Providers</a>
  <a href="#" onclick="showTab('currencies')" data-tab="currencies">💱 Currencies</a>
  <a href="#" onclick="showTab('health')" data-tab="health">💚 Health</a>
  <a href="#" onclick="showTab('audit')" data-tab="audit">🔍 Audit Log</a>
</nav>

<main class="main">
  <div id="content"><div class="loading">⏳ Loading dashboard...</div></div>
</main>

<script>
const TOKEN = new URLSearchParams(window.location.search).get('token') || '';
const BASE = '';

function showTab(name) {
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
  document.querySelector(`[data-tab="${name}"]`).classList.add('active');
  document.getElementById('content').innerHTML = '<div class="loading">⏳ Loading...</div>';
  loadTab(name);
}

async function api(path) {
  const res = await fetch(`${BASE}/admin/api/${path}?token=${TOKEN}`);
  if (res.status === 401) { document.getElementById('content').innerHTML = '<div class="loading" style="color:var(--red)">🔒 Unauthorized. Check your token.</div>'; return null; }
  return res.json();
}

async function loadTab(name) {
  switch(name) {
    case 'dashboard': await loadDashboard(); break;
    case 'users': await loadUsers(); break;
    case 'orders': await loadOrders(); break;
    case 'payments': await loadPayments(); break;
    case 'providers': await loadProviders(); break;
    case 'currencies': await loadCurrencies(); break;
    case 'health': await loadHealth(); break;
    case 'audit': await loadAudit(); break;
  }
}

async function loadDashboard() {
  const data = await api('dashboard');
  if (!data) return;
  const r = data.revenue || {};
  const o = data.orders || {};
  document.getElementById('content').innerHTML = `
    <button class="refresh" onclick="loadDashboard()">🔄 Refresh</button>
    <h2>📊 Dashboard</h2>
    <div class="cards">
      <div class="card"><div class="label">Total Users</div><div class="value">${data.users?.total || 0}</div></div>
      <div class="card"><div class="label">Active Users (7d)</div><div class="value green">${data.active_users_7d || 0}</div></div>
      <div class="card"><div class="label">Today Revenue</div><div class="value">${(r.today?.revenue || 0).toLocaleString()} T</div></div>
      <div class="card"><div class="label">Week Revenue</div><div class="value">${(r.week?.revenue || 0).toLocaleString()} T</div></div>
      <div class="card"><div class="label">Month Revenue</div><div class="value">${(r.month?.revenue || 0).toLocaleString()} T</div></div>
      <div class="card"><div class="label">Success Rate</div><div class="value green">${o.success_rate || 0}%</div></div>
      <div class="card"><div class="label">Cancel Rate</div><div class="value red">${o.cancel_rate || 0}%</div></div>
      <div class="card"><div class="label">Active Providers</div><div class="value">${data.providers?.active_providers || 0}</div></div>
    </div>`;
}

async function loadUsers() {
  const data = await api('users');
  if (!data) return;
  let rows = (data.users || []).map(u => `<tr>
    <td>${u.user_id}</td><td>${(u.balance || 0).toLocaleString()}</td><td>${u.subscription || 'free'}</td>
    <td>${u.is_blocked ? '<span class="badge badge-danger">BLOCKED</span>' : '<span class="badge badge-success">ACTIVE</span>'}</td>
    <td>${u.join_date || ''}</td>
  </tr>`).join('');
  document.getElementById('content').innerHTML = `
    <button class="refresh" onclick="loadUsers()">🔄 Refresh</button>
    <h2>👥 Users</h2>
    <table><thead><tr><th>ID</th><th>Balance</th><th>Tier</th><th>Status</th><th>Joined</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function loadOrders() {
  const data = await api('orders');
  if (!data) return;
  let rows = (data.orders || []).map(o => `<tr>
    <td>#${o.id}</td><td>${o.user_id}</td><td>${o.service}/${o.country}</td><td>${(o.price||0).toLocaleString()}</td>
    <td><span class="badge badge-${o.status==='COMPLETED'?'success':o.status==='CANCELLED'?'danger':'warning'}">${o.status}</span></td>
    <td>${o.created_at || ''}</td>
  </tr>`).join('');
  document.getElementById('content').innerHTML = `
    <button class="refresh" onclick="loadOrders()">🔄 Refresh</button>
    <h2>📦 Orders</h2>
    <table><thead><tr><th>ID</th><th>User</th><th>Service/Country</th><th>Price</th><th>Status</th><th>Created</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function loadPayments() {
  const data = await api('payments');
  if (!data) return;
  let rows = (data.payments || []).map(p => `<tr>
    <td>${p.payment_id?.substring(0,12)}...</td><td>${p.user_id}</td><td>${(p.amount||0).toLocaleString()}</td>
    <td><span class="badge badge-${p.status==='approved'?'success':p.status==='rejected'?'danger':'warning'}">${p.status}</span></td>
    <td>${p.created_at || ''}</td>
  </tr>`).join('');
  document.getElementById('content').innerHTML = `
    <button class="refresh" onclick="loadPayments()">🔄 Refresh</button>
    <h2>💳 Payments</h2>
    <table><thead><tr><th>ID</th><th>User</th><th>Amount</th><th>Status</th><th>Created</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function loadProviders() {
  const data = await api('providers');
  if (!data) return;
  let rows = (data.providers || []).map(p => `<tr>
    <td>${p.display_name || p.name}</td><td>${p.status}</td><td>${p.is_active ? '✅' : '❌'}</td>
    <td>${p.errors || 0}</td><td>${p.last_sync ? new Date(p.last_sync*1000).toLocaleString() : 'never'}</td>
  </tr>`).join('');
  document.getElementById('content').innerHTML = `
    <button class="refresh" onclick="loadProviders()">🔄 Refresh</button>
    <h2>🔌 Providers</h2>
    <table><thead><tr><th>Name</th><th>Health</th><th>Active</th><th>Errors</th><th>Last Sync</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function loadCurrencies() {
  const data = await api('currencies');
  if (!data) return;
  let rows = (data.currencies || []).map(c => `<tr>
    <td>${c.code}</td><td>${c.name}</td><td>${c.symbol}</td><td>${c.rate_to_usd}</td>
    <td>${c.is_active ? '✅' : '❌'}</td><td>${c.is_default ? '⭐' : ''}</td>
  </tr>`).join('');
  document.getElementById('content').innerHTML = `
    <button class="refresh" onclick="loadCurrencies()">🔄 Refresh</button>
    <h2>💱 Currencies</h2>
    <table><thead><tr><th>Code</th><th>Name</th><th>Symbol</th><th>Rate (1 USD)</th><th>Active</th><th>Default</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function loadHealth() {
  const data = await api('health');
  if (!data) return;
  let rows = (data.providers || []).map(p => `<tr>
    <td>${p.display_name || p.name}</td><td><span class="badge badge-${p.status==='healthy'?'success':'danger'}">${p.status}</span></td>
    <td>${p.is_active ? '✅' : '❌'}</td></tr>`).join('');
  document.getElementById('content').innerHTML = `
    <button class="refresh" onclick="loadHealth()">🔄 Refresh</button>
    <h2>💚 System Health</h2>
    <div class="card" style="margin-bottom:16px"><div class="label">Database</div><div class="value green">${data.database}</div></div>
    <table><thead><tr><th>Provider</th><th>Health</th><th>Active</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function loadAudit() {
  const data = await api('audit');
  if (!data) return;
  let rows = (data.audit || []).slice(0, 50).map(e => `<tr>
    <td>${e.admin_id || ''}</td><td>${e.action || ''}</td><td>${e.target || ''}</td>
    <td style="font-size:11px">${(e.details || '').substring(0,60)}</td><td>${e.created_at || ''}</td>
  </tr>`).join('');
  document.getElementById('content').innerHTML = `
    <button class="refresh" onclick="loadAudit()">🔄 Refresh</button>
    <h2>🔍 Audit Log</h2>
    <table><thead><tr><th>Admin</th><th>Action</th><th>Target</th><th>Details</th><th>Time</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// Initial load
loadDashboard();
</script>
</body>
</html>
