# ── CI/CD Pipeline ─────────────────────────────────────────
# GitHub Actions: lint → type check → test → security → build
# Triggered on: push to main, pull requests

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint & Static Analysis ───────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install ruff mypy bandit safety

      - name: Ruff lint
        run: ruff check . --select E,F,W,I,N --ignore E501

      - name: Security scan (bandit)
        run: bandit -r . -x tests/ -ll

      - name: Dependency scan (safety)
        run: safety check --bare || true
        continue-on-error: true

  # ── Tests ────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v --cov=. --cov-report=term --cov-report=xml -x

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Docker Build ─────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t smsbot:ci .

      - name: Verify health check
        run: |
          docker run -d --name smsbot-test smsbot:ci
          sleep 5
          docker exec smsbot-test curl -f http://localhost:5000/ping || true
          docker stop smsbot-test
          docker rm smsbot-test

      - name: Docker image scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: smsbot:ci
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL