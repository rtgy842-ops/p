# ═══════════════════════════════════════════════════════════════
# nginx/numgenius.conf — SSL Reverse Proxy for NumGenius
# ═══════════════════════════════════════════════════════════════
# Certs: /etc/letsencrypt/live/api.abunumapp.com/

# ── Customer Bot (api.abunumapp.com) ────────────────
server {
    listen 80;
    server_name api.abunumapp.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.abunumapp.com;

    ssl_certificate /etc/letsencrypt/live/api.abunumapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.abunumapp.com/privkey.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /verify {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

