# ── docker-compose.yml — Enterprise Architecture (PostgreSQL) ──
# Services: nginx → bot → redis + postgres + worker + beat
# All containers on internal network. Health checks for dependency ordering.

x-common: &common
  restart: unless-stopped
  env_file: .env
  networks:
    - internal

services:
  # ── PostgreSQL 16 ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smsbot-postgres
    environment:
      POSTGRES_USER: smsbot
      POSTGRES_PASSWORD: smsbot_secret
      POSTGRES_DB: smsbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smsbot -d smsbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Nginx: Reverse Proxy + SSL ────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: smsbot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      bot:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://bot:5000/ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ── Bot: Telegram Bot + Flask ─────────────────────────
  bot:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: smsbot-bot
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - bot_logs:/app/logs
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["python", "bot.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Redis: Cache + Queue ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smsbot-redis
    volumes:
      - redis_data:/data
    command: >
      redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
      --save 900 1 --save 300 10 --save 60 10000
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ── Worker: Celery ────────────────────────────────────
  worker:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: smsbot-worker
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["celery", "-A", "tasks", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - bot_logs:/app/logs

  # ── Beat: Celery Beat Scheduler ───────────────────────
  beat:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: smsbot-beat
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["celery", "-A", "tasks", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  bot_logs:
    driver: local
  redis_data:
    driver: local

networks:
  internal:
    driver: bridge
