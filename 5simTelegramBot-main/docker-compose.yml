# ── docker-compose.yml — Enterprise SaaS Architecture ──
# Services: customer_bot / admin_bot → postgres + redis + worker + beat
# Customer Bot & Admin Bot run as SEPARATE containers with SEPARATE tokens
# Nginx is managed on the HOST (not in Docker) for simplicity
# All containers on internal network. Health checks for dependency ordering.

x-common: &common
  restart: unless-stopped
  env_file: .env
  networks:
    - internal

services:
  # ── PostgreSQL 16 ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smsbot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smsbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smsbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smsbot} -d ${POSTGRES_DB:-smsbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis: Cache + Queue ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smsbot-redis
    volumes:
      - redis_data:/data
    command: >
      redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
      --save 900 1 --save 300 10 --save 60 10000
      --requirepass ${REDIS_PASSWORD:-}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ── Customer Bot (NO admin capabilities) ──────────────
  customer_bot:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: smsbot-customer
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
    ports:
      - "5001:5000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    profiles: ["full", "customer"]

  # ── Admin Bot (separate token, admin handlers only) ────
  admin_bot:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: smsbot-admin
    command: ["python", "admin_bot.py"]
    environment:
      BOT_TOKEN: ${ADMIN_BOT_TOKEN}
    ports:
      - "5002:5000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    profiles: ["full", "admin"]

  # ── Worker: Celery ────────────────────────────────────
  worker:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: smsbot-worker
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["celery", "-A", "tasks", "worker", "--loglevel=info", "--concurrency=2"]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles: ["full", "worker"]

  # ── Beat: Celery Beat Scheduler ───────────────────────
  beat:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: smsbot-beat
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["celery", "-A", "tasks", "beat", "--loglevel=info"]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles: ["full", "worker"]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  internal:
    driver: bridge
